set_pixels:
  target:
    entity:
      integration: light_show_studio
      domain: light
  fields:
    colors:
      required: true
      example: '["#ff0000", "#00ff00", [0, 0, 255]]'
      selector:
        object:
    repeat:
      default: true
      selector:
        boolean:

play_sequence:
  fields:
    file:
      required: true
      example: halloween.fseq
      selector:
        text:
    loop:
      default: false
      selector:
        boolean:
    media_player:
      selector:
        entity:
          domain: media_player
    audio:
      example: library://track/123
      selector:
        text:
    audio_offset:
      default: 0
      selector:
        number:
          min: -5
          max: 5
          step: 0.05
          unit_of_measurement: s

stop_sequence:
