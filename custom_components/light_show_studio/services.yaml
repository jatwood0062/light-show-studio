set_pixels:
  target:
    entity:
      integration: light_show_studio
      domain: light
  fields:
    colors:
      required: true
      example: '["#ff0000", "#00ff00", [0, 0, 255]]'
      selector:
        object:
    repeat:
      default: true
      selector:
        boolean:

set_pattern:
  target:
    entity:
      integration: light_show_studio
      domain: light
  fields:
    pattern:
      example: Classic Multicolor
      selector:
        select:
          options:
            - "Classic Multicolor"
            - "Warm White"
            - "Cool White"
            - "Red & Green"
            - "Red, Green & White"
            - "Candy Cane"
            - "Blue & White"
            - "Gold & White"
            - "Pastel"
            - "Halloween"
            - "Red, White & Blue"
            - "Valentine"
            - "Rainbow"
    effect:
      example: Twinkle
      selector:
        select:
          options:
            - "Steady"
            - "Twinkle"
            - "Chase"
            - "Twinkle Swap"
            - "Marquee"
            - "Fade"
            - "Sparkle"
            - "Alternate"
            - "Wave"
    speed:
      example: 50
      selector:
        number:
          min: 1
          max: 100
          mode: slider

play_sequence:
  fields:
    file:
      required: true
      example: My Show.fseq
      selector:
        text:
    loop:
      default: false
      selector:
        boolean:
    media_player:
      selector:
        entity:
          domain: media_player
    audio:
      example: library://track/123
      selector:
        text:
    audio_offset:
      default: 0
      selector:
        number:
          min: -5
          max: 5
          step: 0.05
          unit_of_measurement: s

stop_sequence:
