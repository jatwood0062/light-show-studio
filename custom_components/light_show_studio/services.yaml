set_pixels:
  target:
    entity:
      integration: light_show_studio
      domain: light
  fields:
    colors:
      required: true
      example: '["#ff0000", "#00ff00", [0, 0, 255]]'
      selector:
        object:
    repeat:
      default: true
      selector:
        boolean:

set_pattern:
  target:
    entity:
      integration: light_show_studio
      domain: light
  fields:
    pattern:
      example: Classic Multicolor
      selector:
        select:
          options:
            - "Classic Multicolor"
            - "Warm White"
            - "Cool White"
            - "Red & Green"
            - "Red, Green & White"
            - "Candy Cane"
            - "Blue & White"
            - "Gold & White"
            - "Pastel"
            - "Halloween"
            - "Red, White & Blue"
            - "Valentine"
            - "Rainbow"
          custom_value: true  # or one of your own patterns, by name
    effect:
      example: Twinkle
      selector:
        select:
          options:
            - "Steady"
            - "Twinkle"
            - "Chase"
            - "Twinkle Swap"
            - "Marquee"
            - "Fade"
            - "Sparkle"
            - "Alternate"
            - "Wave"
            - "Sweep"
            - "Ripple"
            - "Snowfall"
            - "Rise"
            - "Rainbow Wash"
            - "Fireworks"
            - "Breathe Outward"
            - "Gradient Axis"
            - "Plasma Field"
            - "Candy Helix"
    speed:
      example: 50
      selector:
        number:
          min: 1
          max: 100
          mode: slider
    transition:
      example: 2
      selector:
        number:
          min: 0
          max: 1800
          step: 0.1
          unit_of_measurement: s

play_sequence:
  fields:
    file:
      required: true
      example: My Show.fseq
      selector:
        text:
    loop:
      default: false
      selector:
        boolean:
    media_player:
      selector:
        entity:
          domain: media_player
    audio:
      example: library://track/123
      selector:
        text:
    audio_offset:
      default: 0
      selector:
        number:
          min: -5
          max: 5
          step: 0.05
          unit_of_measurement: s

stop_sequence:

